packages:
  - apps/*
  - packages/*

# Сборка образа делает `pnpm deploy` — он собирает пакет со всеми зависимостями
# в отдельную папку. Начиная с pnpm 10 это работает только с внедрёнными
# зависимостями рабочего пространства: @gramota/shared должен копироваться
# в node_modules сервера, а не быть ссылкой на соседнюю папку, которой
# в готовом образе уже нет.
injectWorkspacePackages: true
# Fastify должен быть строго один на всё дерево: иначе @fastify/* плагины
# и @nestjs/platform-fastify собираются с разными копиями типов и не стыкуются.
overrides:
  fastify: 5.11.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
