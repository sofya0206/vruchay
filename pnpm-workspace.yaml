packages:
  - apps/*
  - packages/*

# Сборка образа делает `pnpm deploy` — он собирает пакет со всеми зависимостями
# в отдельную папку. Начиная с pnpm 10 это работает только с внедрёнными
# зависимостями рабочего пространства: @gramota/shared должен копироваться
# в node_modules сервера, а не быть ссылкой на соседнюю папку, которой
# в готовом образе уже нет.
injectWorkspacePackages: true
# Fastify должен быть строго один на всё дерево: иначе @fastify/* плагины
# и @nestjs/platform-fastify собираются с разными копиями типов и не стыкуются.
overrides:
  fastify: 5.12.1
  # Ниже — закрытие уязвимостей в транзитивных пакетах (pnpm audit, 22.08.2026).
  # Убирать строку можно, когда зависимость сверху сама подтянет починенную версию.
  find-my-way: '>=9.7.0'
  'fast-uri@3': '>=3.1.5'
  'fast-uri@^4': '4.1.2'
  'brace-expansion@1': '>=1.1.18'
  'js-yaml@4': '>=4.3.1'
  'nanoid@3': '>=3.3.18'
  deepmerge-ts: '>=8.0.0'
  uuid: '>=11.1.1'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
