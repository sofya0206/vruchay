<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f1d" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Вручай" />
    <!--
      Знак во вкладке — тот же, что в шапке и на заставке (public/icon.svg).

      Вторая строка не про старые браузеры, а про клиентов, которые берут
      значок по адресу `/favicon.ico`, не читая разметку: без файла они
      рисуют собственную заглушку — цветной квадрат с чужим символом.
      Оба файла делает `scripts/make-icons.mjs` из того же icon.svg.
    -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Вручай</title>

    <!--
      Заставка на время загрузки.

      Живёт прямо в разметке, а не в приложении: пока браузер скачивает
      и запускает код, показывать её попросту некому — а именно эти первые
      секунды на медленной связи человек и смотрит в пустую белую страницу.

      Появляется не сразу, а через треть секунды: на быстрой связи
      приложение поднимается раньше, и мелькнувшая заставка раздражала бы
      сильнее, чем её отсутствие.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        /* Поверх всего: приложение может успеть отрисовать часть себя
           раньше, чем заставка уйдёт, и просвечивающая сквозь неё шапка
           выглядит как поломка вёрстки. */
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #ffffff;
        opacity: 0;
        animation: splash-in 0.4s ease-out 0.35s forwards;
      }
      #splash .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        /* Тот же цвет, что у знака в шапке и у иконки приложения:
           заставка — первое, что человек видит, и знак на ней должен быть
           тем же самым, а не родственным. */
        background: #4a3fce;
        display: grid;
        place-items: center;
        animation: splash-beat 1.8s ease-in-out infinite;
      }
      /*
        Гарнитура та же, что и во всём интерфейсе, но с системным запасным
        вариантом: заставка рисуется до того, как приложение подключит свои
        стили, и на первой отрисовке Jost может быть ещё не загружен.
      */
      #splash .word {
        margin-top: 18px;
        text-align: center;
        font: 500 15px/1.4 'Jost', ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #36394a;
      }
      @keyframes splash-in {
        to {
          opacity: 1;
        }
      }
      /* Знак медленно «дышит»: признак, что дело идёт, без вертящегося
         колеса — оно на наградной странице выглядит тревожно. */
      @keyframes splash-beat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.07);
        }
      }
      /*
        Цвета заставки — те же, что у подложки и приглушённого текста
        кабинета в каждой теме (index.css). Атрибут data-theme ставит
        скрипт ниже, до первой отрисовки.
      */
      @media (prefers-color-scheme: dark) {
        html:not([data-theme='light']) #splash {
          background: #0b0f1d;
        }
        html:not([data-theme='light']) #splash .word {
          color: #9aa4c2;
        }
      }
      html[data-theme='dark'] #splash {
        background: #0b0f1d;
      }
      html[data-theme='dark'] #splash .word {
        color: #9aa4c2;
      }
      /* Тем, кто просил систему не двигать картинки, показываем неподвижно. */
      @media (prefers-reduced-motion: reduce) {
        #splash {
          animation: none;
          opacity: 1;
        }
        #splash .mark {
          animation: none;
        }
      }
      /*
        На странице печати заставки нет вовсе — см. скрипт ниже.
        Правило нужно на те миллисекунды, пока разметка ещё разбирается
        и узел существует: без него заставка успела бы мелькнуть,
        а с непрозрачным фоном мелькнуть — значит попасть в документ.
      */
      html.print-page #splash {
        display: none !important;
      }
    </style>

    <!--
      Страница печати в PDF отдаётся тем же index.html, что и кабинет,
      вместе с заставкой. Заставка при этом не украшение, а непрозрачный
      слой во весь экран поверх всего: 28.08.2026 она печаталась поверх
      фамилии награждённого, и участники получили испорченные грамоты.

      Убираем узел здесь, в разметке, а не в приложении. Приложение
      убирало её тоже, но не успевало: браузер воркера печатает, как
      только страница объявила готовность, — а это раньше, чем приезжают
      787 килобайт кода кабинета. Гонка «кто быстрее» на медленной машине
      возвращается, поэтому её здесь нет: к моменту, когда странице есть
      что печатать, узла заставки уже не существует.

      Скрипт обычный, а не модуль: модуль откладывается до конца разбора
      разметки, а нам нужно снять заставку до первой отрисовки.

      Оба срока нужны: собранный index.html прогоняется через
      предварительную отрисовку (prerender.mjs), и в нём заставка стоит
      в конце body — то есть на момент выполнения этого скрипта её ещё
      нет. Поэтому сначала запрещаем показ правилом, а сам узел убираем,
      как только разметка разобрана.
    -->
    <!--
      Тема из прошлого визита — до первой отрисовки. Приложение поставит
      тот же атрибут позже (settings/preferences.ts), но заставка успела
      бы мелькнуть белым у того, кто выбрал тёмную. Ключ хранилища —
      тот же, что в приложении.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('vruchay:theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (e) {
          // Хранилище недоступно — остаётся системная тема.
        }
      })();
    </script>
    <script>
      (function () {
        // Тот же адрес, по которому страницу печати узнаёт приложение
        // (см. App.tsx). Разойтись они не должны.
        if (window.location.pathname !== '/render') return;
        document.documentElement.classList.add('print-page');

        var drop = function () {
          var splash = document.getElementById('splash');
          if (!splash) return false;
          if (splash.parentNode) splash.parentNode.removeChild(splash);
          return true;
        };
        if (drop()) return;

        /*
          Наблюдатель, а не обработчик DOMContentLoaded.

          Событие наступает уже после того, как выполнились отложенные
          скрипты, — то есть после запуска приложения. А приложение
          на макете без фоновой картинки успевает объявить готовность
          в тот же миг, и печать началась бы при живой заставке.
          Наблюдатель же срабатывает сразу, как узел появился в разметке,
          и раньше любого скрипта.
        */
        var watch = new MutationObserver(function () {
          if (drop()) watch.disconnect();
        });
        watch.observe(document.documentElement, { childList: true, subtree: true });
        // Разбор разметки закончен: больше заставке взяться неоткуда,
        // и держать наблюдателя на всю жизнь страницы незачем.
        document.addEventListener('DOMContentLoaded', function () {
          drop();
          watch.disconnect();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <div id="splash">
      <div>
        <div class="mark">
          <!-- Буква «В» — тот же знак, что в шапке (shell/Brand.tsx). -->
          <svg width="56" height="56" viewBox="0 0 24 24" fill="#ffffff" aria-hidden="true">
            <path d="M7.5,6.19 H13.5 A2.77,2.77 0 0 1 13.5,11.72 H7.5 Z" />
            <path d="M7.5,11.72 H13.69 A2.95,2.95 0 0 1 13.69,17.63 H7.5 Z" />
          </svg>
        </div>
        <div class="word">Вручай</div>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
