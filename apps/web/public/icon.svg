<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Фирменный знак: синий фон дизайн-системы и наградная медаль с лентой.
       Тот же образ, что и в шапке приложения, — иконка на устройстве
       должна узнаваться как то же самое приложение.

       Фигурка залита, а не обведена: во вкладке браузера знак виден
       шириной в шестнадцать точек, и контурный рисунок на таком размере
       рассыпается в серую крупу. Заливка читается при любом уменьшении. -->
  <rect width="512" height="512" rx="112" fill="#127EE3"/>
  <g fill="#FFFFFF">
    <circle cx="256" cy="204" r="92"/>
    <path d="M196 292 L168 428 L256 380 L344 428 L316 292 L256 322 Z"/>
  </g>
</svg>
