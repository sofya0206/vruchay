# Прод и стейджинг. Требует .env рядом — см. RUNBOOK.md.
#
# PostgreSQL живёт здесь же, в контейнере: при наших объёмах управляемая база
# простаивала бы (ADR-0002). Условие этого решения — ежедневный дамп в S3
# и ежемесячная проверка восстановления, без них так делать нельзя.

name: vruchay

services:
  # Миграции выполняются отдельным разовым контейнером до старта приложения.
  # Не в entrypoint api: тогда при двух экземплярах они запустились бы дважды
  # одновременно, а prisma не рассчитана на параллельное применение.
  migrate:
    image: ${IMAGE_PREFIX}/gramota-server:${IMAGE_TAG:-latest}
    # Двоичный файл из образа, а не через npx: npx при отсутствии локальной
    # копии молча скачает другую версию из сети, а нам нужен громкий отказ.
    command: ['node_modules/.bin/prisma', 'migrate', 'deploy']
    env_file: .env
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX}/gramota-server:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      # Задания обрабатывает отдельный контейнер, здесь только HTTP.
      RUN_WORKER: 'false'
      # Сколько пакетов одна организация держит в очереди одновременно.
      ORG_ACTIVE_JOBS: ${ORG_ACTIVE_JOBS:-3}
      # Пределы на «Одним PDF на печать». Связаны с mem_limit ниже напрямую:
      # склейка не стримится, pdf-lib держит в памяти и исходники, и готовый
      # документ. Поднимая одно, поднимайте и другое — иначе два
      # одновременных скачивания уронят кабинет всем пользователям сразу.
      PRINT_MERGE_LIMIT_FILES: ${PRINT_MERGE_LIMIT_FILES:-300}
      PRINT_MERGE_LIMIT_MB: ${PRINT_MERGE_LIMIT_MB:-150}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    mem_limit: 1g
    # Приложению не нужна ни одна возможность ядра, а повышение прав внутри
    # контейнера не нужно тем более: обе двери закрываем явно.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Стандартный профиль seccomp Docker применяет и без этой строки.
      # Пишем её явно, чтобы она была видна: тогда `privileged: true` или
      # `seccomp:unconfined`, добавленные когда-нибудь «на время, чтобы
      # заработало», бросятся в глаза при чтении файла, а не отменят
      # защиту молча.
      #
      # Своего, более узкого профиля здесь нет намеренно. Он имел бы смысл
      # для приложения, но его пришлось бы держать общим с воркером, а там
      # Chromium: набор системных вызовов у него широкий, меняется от версии
      # к версии, и ошибка в профиле проявляется не отказом при старте,
      # а сорванной печатью посреди партии из трёхсот грамот. Цена ошибки
      # выше выигрыша.
      - seccomp=builtin
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: ${IMAGE_PREFIX}/gramota-server:${IMAGE_TAG:-latest}
    command: ['node', 'dist/worker.js']
    restart: always
    env_file: .env
    environment:
      RUN_WORKER: 'true'
      # Страница печати берётся у соседнего контейнера, а не через интернет.
      RENDER_BASE_URL: http://web:8080
    depends_on:
      web:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    # Жёсткий лимит: Chromium течёт по памяти при длительной работе, и без
    # ограничения он утянул бы за собой базу на том же сервере. При превышении
    # ядро убьёт воркер, а не PostgreSQL, и restart вернёт его в строй.
    mem_limit: 2g
    # Chromium использует разделяемую память; стандартных 64 МБ ему мало.
    shm_size: 512m
    # Здесь это важнее, чем у приложения: Chromium запускается без собственной
    # песочницы (в контейнере она требует прав, которые опаснее самой песочницы),
    # поэтому ограничиваем снаружи. Chromium с ключом --no-sandbox не требует
    # ни одной возможности ядра — проверено запуском в этом же образе.
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=builtin

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    # База — самое ценное, что есть на сервере, и ограничена она была
    # только по памяти. Убираем всё лишнее, но не всё подряд.
    #
    # Пять возможностей ниже вернуть **обязательно**. Официальный образ
    # postgres стартует от root: выправляет владельца и права каталога
    # данных (CHOWN, DAC_OVERRIDE, FOWNER) и только потом переходит
    # к пользователю postgres (SETUID, SETGID). Без них контейнер пишет
    # «chmod: Operation not permitted», не проходит проверку здоровья
    # и тянет за собой всё остальное — сервис ложится целиком.
    #
    # Так и случилось 07.08.2026 при выкате: голый `cap_drop: [ALL]`
    # уронил боевую базу. Прежний комментарий здесь уверял, что
    # «возможности ядра ей не нужны» — это была неправда, и стоила
    # она получаса простоя.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
    # Порт наружу не публикуется: база доступна только из сети compose.
    #
    # 1 ГБ, а не 2: на машине 4 ГБ, и потолки всех служб должны в неё влезать.
    # Иначе воркер с Chromium и база могут одновременно дорасти до своих
    # лимитов, ни один cgroup не сработает, и жертву выберет ядро — вероятнее
    # всего базу, как самый крупный процесс. Терять базу вместо воркера,
    # который перезапустится сам, нам совершенно незачем.
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    mem_limit: 512m
    # Те же пять возможностей, что и у базы, и по той же причине: образ
    # redis стартует от root, выправляет права каталога /data и переходит
    # к пользователю redis. Без них — «find: ./appendonlydir: Permission
    # denied» и бесконечный перезапуск.
    #
    # Нашим собственным образам (api, worker) этого не нужно: они стартуют
    # сразу от пользователя app и ничего не переприсваивают.
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
      - seccomp=builtin

  web:
    image: ${IMAGE_PREFIX}/gramota-web:${IMAGE_TAG:-latest}
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
      # Адрес с www: на него есть запись в DNS, значит Caddy обязан о нём
      # знать. Иначе запрос доходит до сервера, но имени такого нет —
      # сертификат не подобрать, и посетитель видит ошибку защищённого
      # соединения вместо перенаправления.
      WWW_DOMAIN: ${WWW_DOMAIN:-www.${DOMAIN}}
      # Адрес объектного хранилища попадает в политику содержимого:
      # оттуда грузятся фоны сертификатов, без него они не отобразятся.
      S3_ORIGIN: ${S3_ORIGIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    # Caddy — единственный контейнер, смотрящий наружу, и единственный,
    # которому нужна возможность ядра: без NET_BIND_SERVICE он не займёт
    # порты 80 и 443, работая не от корневого пользователя.
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
      - seccomp=builtin
    depends_on:
      api:
        condition: service_healthy

volumes:
  pg-data:
  redis-data:
  caddy-data:
  caddy-config:
