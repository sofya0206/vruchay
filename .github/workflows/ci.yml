name: CI

on:
  push:
    branches: [main]
  pull_request:

# Наименьшие права по умолчанию: конвейер имеет доступ к реестру образов
# и к серверу, поэтому каждая работа расширяет права явно и только для себя.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Клиент Prisma не лежит в репозитории — без него сборка сервера
      # не знает типов базы и падает.
      - run: pnpm --filter @gramota/server exec prisma generate
      # Сборка веба доотрисовывает публичные страницы в браузере (для поиска),
      # поэтому Chromium нужен и здесь, а не только в образе сервера.
      - run: pnpm --filter @gramota/web exec playwright install --with-deps chromium
      # Сборка раньше тестов: тесты web импортируют @gramota/shared из dist.
      - run: pnpm -r build
      - run: pnpm -r test

  # Слой, который разговаривает с настоящей базой.
  #
  # Отдельной работой, а не шагом в `check`: ей нужны Postgres и Redis,
  # и обычные тесты не должны от них зависеть — иначе на машине без
  # поднятой базы `pnpm test` перестанет работать, и им перестанут
  # пользоваться. Работа обязательна для вливания: 28.08.2026 ядро
  # продукта не работало вовсе при 979 зелёных тестах, и заметил это
  # человек, а не конвейер.
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gramota
          POSTGRES_PASSWORD: gramota
          POSTGRES_DB: gramota
        ports:
          - 5432:5432
        # Без проверки готовности первый же `migrate deploy` упирается
        # в ещё не поднявшуюся базу.
        options: >-
          --health-cmd "pg_isready -U gramota"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://gramota:gramota@localhost:5432/gramota
      INTEGRATION_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gramota/server exec prisma generate
      # Тесты слоя печатают настоящий PDF настоящим Chromium: без него
      # «выпуск прошёл» ничего не значит — файл может быть пустым.
      - run: pnpm --filter @gramota/server exec playwright install --with-deps chromium
      # Общий пакет нужен собранным: макет листа и подстановка переменных
      # приезжают из него.
      - run: pnpm --filter @gramota/shared build
      - run: pnpm test:integration

  docker:
    runs-on: ubuntu-latest
    needs: [check, integration]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gramota-server:latest
            ghcr.io/${{ github.repository_owner }}/gramota-server:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Данные предпринимателя для политики обработки данных: в репозитории
          # их нет, поэтому приходят секретами. Без них страница политики
          # честно сообщит, что опубликована не полностью.
          build-args: |
            VITE_OPERATOR_NAME=${{ secrets.OPERATOR_NAME }}
            VITE_OPERATOR_INN=${{ secrets.OPERATOR_INN }}
            VITE_OPERATOR_OGRNIP=${{ secrets.OPERATOR_OGRNIP }}
            VITE_OPERATOR_ADDRESS=${{ secrets.OPERATOR_ADDRESS }}
            VITE_OPERATOR_EMAIL=${{ secrets.OPERATOR_EMAIL }}
            VITE_OPERATOR_PHONE=${{ secrets.OPERATOR_PHONE }}
            VITE_POLICY_DATE=${{ secrets.POLICY_DATE }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gramota-web:latest
            ghcr.io/${{ github.repository_owner }}/gramota-web:${{ github.sha }}
