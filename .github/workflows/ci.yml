name: CI

on:
  push:
    branches: [main]
  pull_request:

# Наименьшие права по умолчанию: конвейер имеет доступ к реестру образов
# и к серверу, поэтому каждая работа расширяет права явно и только для себя.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Сборка раньше тестов: тесты web импортируют @gramota/shared из dist.
      - run: pnpm -r build
      - run: pnpm -r test

  docker:
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gramota-server:latest
            ghcr.io/${{ github.repository_owner }}/gramota-server:${{ github.sha }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # Данные предпринимателя для политики обработки данных: в репозитории
          # их нет, поэтому приходят секретами. Без них страница политики
          # честно сообщит, что опубликована не полностью.
          build-args: |
            VITE_OPERATOR_NAME=${{ secrets.OPERATOR_NAME }}
            VITE_OPERATOR_INN=${{ secrets.OPERATOR_INN }}
            VITE_OPERATOR_OGRNIP=${{ secrets.OPERATOR_OGRNIP }}
            VITE_OPERATOR_ADDRESS=${{ secrets.OPERATOR_ADDRESS }}
            VITE_OPERATOR_EMAIL=${{ secrets.OPERATOR_EMAIL }}
            VITE_OPERATOR_PHONE=${{ secrets.OPERATOR_PHONE }}
            VITE_POLICY_DATE=${{ secrets.POLICY_DATE }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/gramota-web:latest
            ghcr.io/${{ github.repository_owner }}/gramota-web:${{ github.sha }}
