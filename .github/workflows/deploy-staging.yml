# Включится после покупки VPS: добавьте секреты STAGING_SSH_HOST, STAGING_SSH_USER,
# STAGING_SSH_KEY (приватный ключ) в Settings → Secrets and variables → Actions.
name: Deploy staging

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Deploy over SSH
        env:
          HAS_SECRETS: ${{ secrets.STAGING_SSH_HOST != '' }}
        run: |
          if [ "$HAS_SECRETS" != "true" ]; then
            echo "Секреты стейджинга не настроены — пропускаю (это нормально до покупки VPS)."
            exit 0
          fi
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        if: ${{ secrets.STAGING_SSH_HOST != '' }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/gramota
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker system prune -f
