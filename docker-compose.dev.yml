name: gramota-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gramota
      POSTGRES_PASSWORD: gramota
      POSTGRES_DB: gramota
    ports:
      - '5432:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gramota']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: gramota
      MINIO_ROOT_PASSWORD: gramota-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  pg-data:
  redis-data:
  minio-data:
